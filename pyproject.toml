[project]
name = "watchline"
version = "0.1.0"
description = "A Kubernetes pod event watcher for learning and visualizing cluster activity."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kubernetes>=31.0.0,<33.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
]

[project.scripts]
watchline = "watchline.watcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

