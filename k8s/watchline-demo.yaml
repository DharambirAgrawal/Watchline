apiVersion: v1
kind: Namespace
metadata:
  name: watchline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-demo
  namespace: watchline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pod-demo
  template:
    metadata:
      labels:
        app: pod-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: pod-demo
  namespace: watchline
spec:
  selector:
    app: pod-demo
  ports:
    - name: http
      port: 80
      targetPort: http

